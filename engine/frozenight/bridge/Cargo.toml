[package]
name = "upapawn-engine"
version = "1.0.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "frozenight-reference"
path = "src/main.rs"

[dependencies]
frozenight = { path = "../core" }
cozy-chess = "=0.3.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
