name: Publish package (manual)
run-name: "${{ inputs.publish && 'Publish' || 'Verify only' }} ${{ github.ref_name }} → ${{ inputs.channel }}"

on:
  workflow_dispatch:
    inputs:
      channel:
        description: npm channel (next for experimental releases; latest for default installs)
        required: true
        type: choice
        default: next
        options: [next, latest]
      publish:
        description: Publish to npm and create a GitHub release after all checks pass
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Serialize releases across versions/channels; never cancel an in-progress upload.
concurrency:
  group: npm-publication
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}
  RELEASE_CHANNEL: ${{ inputs.channel }}
  RELEASE_EXPECTED_COMMIT: ${{ github.sha }}
  RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  verify:
    name: Verify tagged source and release artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Require dispatch from a release tag
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [[ "$DISPATCH_REF" != refs/tags/v* ]]; then
            echo "::error::Choose the release tag (for example v0.0.1) in Use workflow from. Releases must run from a tag so provenance identifies the correct source commit."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check tag, version, changelog, repository and commit
        id: release
        run: bun run release:check --tag "$RELEASE_TAG" --channel "$RELEASE_CHANNEL"

      - run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown

      - name: Prefer Ubuntu archive for system packages
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [[ -f "$source" ]]; then
              sudo sed -i -E 's|https?://azure\.archive\.ubuntu\.com/ubuntu/?|https://archive.ubuntu.com/ubuntu/|g' "$source"
            fi
          done

      - name: Install Playwright system dependencies
        timeout-minutes: 10
        run: bunx playwright install-deps chromium firefox webkit

      - name: Install Playwright browsers
        timeout-minutes: 10
        run: bunx playwright install chromium firefox webkit

      - name: Build engine from source, independently rebuild, and test the exact package tarball
        run: bun run release:prepare

      - name: Rehearse npm publication without credentials
        run: bun run release:dry-run --tag "$RELEASE_CHANNEL"

      - name: Save the verified release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-release
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: |
            .build/*.tgz
            .build/release.json
            .build/release-notes.md
            .build/reports/

      - name: Explain the result
        env:
          WILL_PUBLISH: ${{ inputs.publish }}
        run: |
          {
            echo "## Release verification passed"
            echo ""
            echo "Tag: $RELEASE_TAG; channel: $RELEASE_CHANNEL."
            echo ""
            if [[ "$WILL_PUBLISH" == "true" ]]; then
              echo "The publication job will use this run's verified artifact."
            else
              echo "Verification only: nothing was published. Review the verified-release artifact."
              echo "Run this workflow again from the same tag with the same channel and the publish checkbox selected when ready."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-failure-diagnostics
          include-hidden-files: true
          path: |
            .build/reports/
            test-results/

  publish:
    name: Publish the verified tarball to npm
    needs: verify
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    # allow about 20 minutes of registry polling plus setup and upload time
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-release
          path: .build

      - name: Publish or resume an identical successful upload, then verify npm
        env:
          # Optional bootstrap credential for the first-ever package publication.
          # Remove it after configuring the npm trusted publisher.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_PROVENANCE: ${{ github.event.repository.visibility == 'public' }}
        run: bun run release:publish --release-tag "$RELEASE_TAG" --tag "$RELEASE_CHANNEL"

      - name: Save publication evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publication-evidence
          overwrite: true
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
          path: |
            .build/reports/published.json
            .build/reports/publication-status.json

  release:
    name: Create GitHub release from the changelog
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-release
          path: .build

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: publication-evidence
          path: .build/reports

      - name: Create or finish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release/finish-release.ts --tag "$RELEASE_TAG" --channel "$RELEASE_CHANNEL"
