name: Verify engine package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown
      - name: Type-check SDK, scripts and tests
        run: bun run check
      - name: Prefer Ubuntu archive for system packages
        shell: bash
        run: |
          # Current hosted images use a mirror list; older images use direct URLs.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [[ -f "$source" ]]; then
              sudo sed -i -E \
                's|https?://azure\.archive\.ubuntu\.com/ubuntu/?|https://archive.ubuntu.com/ubuntu/|g' \
                "$source"
            fi
          done
      - name: Install Playwright system dependencies
        timeout-minutes: 10
        run: bunx playwright install-deps chromium firefox webkit
      - name: Install Playwright browsers
        timeout-minutes: 10
        run: bunx playwright install chromium firefox webkit
      - run: bun run release:prepare
      - run: bun run release:dry-run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: package-and-verification
          include-hidden-files: true
          path: |
            .build/*.tgz
            .build/release.json
            .build/reports/
  engine:
    name: Verify independent build against tested npm artifact
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package-and-verification
          path: .build
      - name: Independently rebuild and compare the engine with the tested package
        run: bun run engine:verify --package .build/package.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: rebuilt-engine-verification
          include-hidden-files: true
          path: .build/reports/engine-verification.json
