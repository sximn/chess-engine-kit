name: Verify engine package
on: [push, pull_request, workflow_dispatch]
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Prefer Ubuntu archive for system packages
        shell: bash
        run: |
          # Current hosted images use a mirror list; older images use direct URLs.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [[ -f "$source" ]]; then
              sudo sed -i -E \
                's|https?://azure\.archive\.ubuntu\.com/ubuntu/?|https://archive.ubuntu.com/ubuntu/|g' \
                "$source"
            fi
          done
      - name: Install Playwright system dependencies
        timeout-minutes: 10
        run: bunx playwright install-deps chromium firefox webkit
      - name: Install Playwright browsers
        timeout-minutes: 10
        run: bunx playwright install chromium firefox webkit
      - run: bun run release:prepare
      - run: bun run release:dry-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-and-verification
          path: |
            .build/*.tgz
            .build/release.json
            .build/reports/
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown
      - run: bun install --frozen-lockfile
      - run: bun run engine:build && bun run engine:notices
      - run: bun run test:native
      - run: bun scripts/maintenance/engine/verify-reproducibility.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rebuilt-engine-verification
          path: .build/reports/
