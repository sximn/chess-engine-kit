name: Verify engine package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown
      - name: Type-check SDK, scripts and tests
        run: bun run check
      - name: Prefer Ubuntu archive for system packages
        shell: bash
        run: |
          # Current hosted images use a mirror list; older images use direct URLs.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [[ -f "$source" ]]; then
              sudo sed -i -E \
                's|https?://azure\.archive\.ubuntu\.com/ubuntu/?|https://archive.ubuntu.com/ubuntu/|g' \
                "$source"
            fi
          done
      - name: Install Playwright system dependencies
        timeout-minutes: 10
        run: bunx playwright install-deps chromium firefox webkit
      - name: Install Playwright browsers
        timeout-minutes: 10
        run: bunx playwright install chromium firefox webkit
      - run: bun run release:prepare
      - run: bun run release:dry-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-and-verification
          include-hidden-files: true
          path: |
            .build/*.tgz
            .build/release.json
            .build/reports/
  engine:
    name: Verify container build against tested npm artifact
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ENGINE_BUILD_CONTAINER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: package-and-verification
          path: .build
      - name: Independently rebuild and compare the container engine with the tested package
        run: bun run engine:verify --package .build/package.tgz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rebuilt-container-engine-verification
          include-hidden-files: true
          path: .build/reports/engine-verification.json
